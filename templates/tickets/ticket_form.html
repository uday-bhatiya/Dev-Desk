{% extends "base.html" %}

{% block title %}New ticket{% endblock %}

{% block content %}
  <div class="card form-card">
    <h1>New ticket</h1>
    <p class="muted">Tell the IT team what is wrong. They will pick it up from here.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/_form_fields.html" %}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit ticket</button>
        <a class="btn btn-secondary" href="{% url 'ticket_list' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
